<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Real-time | Premium Tracking</title>
    
    <!-- Leaflet & Google Fonts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #c5a059; /* Gold Elegan */
            --dark: #121212;
            --glass: rgba(255, 255, 255, 0.85);
        }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--dark);
            overflow: hidden;
        }

        #map { height: 100vh; width: 100%; filter: grayscale(0.2) contrast(1.1); }

        /* Floating UI Glassmorphism */
        .glass-panel {
            position: absolute; top: 20px; left: 20px; right: 20px;
            z-index: 1000; background: var(--glass);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px; padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            max-width: 320px; transition: all 0.4s ease;
        }

        @media (min-width: 768px) { .glass-panel { top: 30px; left: 30px; } }

        h2 { 
            margin: 0 0 15px 0; font-size: 20px; font-weight: 700; 
            color: var(--dark); letter-spacing: -0.5px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .status-pill {
            display: flex; align-items: center; gap: 8px;
            background: rgba(0,0,0,0.05); padding: 8px 12px;
            border-radius: 12px; margin-bottom: 10px; font-size: 13px;
        }

        .dot { height: 8px; width: 8px; border-radius: 50%; position: relative; }
        .dot::after {
            content: ''; position: absolute; width: 100%; height: 100%;
            background: inherit; border-radius: 50%; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }

        input {
            width: 100%; box-sizing: border-box; border: 1.5px solid rgba(0,0,0,0.1);
            background: white; padding: 12px 15px; border-radius: 12px;
            margin: 10px 0; font-family: inherit; font-size: 14px; outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(197, 160, 89, 0.1); }

        .btn-premium {
            width: 100%; background: var(--dark); color: white;
            border: none; padding: 14px; border-radius: 12px;
            font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-premium:active { transform: scale(0.96); }
        .btn-premium:hover { background: #333; }

        /* Leaflet Customization */
        .leaflet-bar { border: none !important; box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important; }
        .leaflet-bar a { background: var(--glass) !important; color: var(--dark) !important; border-radius: 10px !important; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h2>Radar Premium 🛰️</h2>
        
        <div class="status-pill">
            <span class="dot" style="background: #3498db;"></span>
            <span>ESP8266: <b id="esp-val">Jl. Bukit Hijau</b></span>
        </div>

        <div class="status-pill">
            <span class="dot" id="friend-dot" style="background: #95a5a6;"></span>
            <span>Status: <b id="friend-val">Menunggu Teman...</b></span>
        </div>

        <input type="text" id="namaTeman" placeholder="Siapa namamu?">
        <button class="btn-premium" onclick="mulaiTracking()">
            <span>Bagi Lokasi Real-time</span>
        </button>
    </div>

    <div id="map"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://lacak-esp8266-24515-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        var map = L.map('map', { zoomControl: false }).setView([-7.926588, 112.597525], 16);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        var markerESP = L.marker([-7.926588, 112.597525]).addTo(map).bindPopup("<b>Alvino (ESP8266)</b>");
        var markersTeman = {};

        db.ref('pelacak').on('value', (snap) => {
            const val = snap.val();
            if(val) markerESP.setLatLng([val.lat, val.lng]);
        });

        db.ref('users').on('value', (snap) => {
            const allUsers = snap.val();
            if(allUsers) {
                document.getElementById('friend-dot').style.background = "#e74c3c";
                document.getElementById('friend-val').innerText = "Teman Terdeteksi";
                
                for (let name in allUsers) {
                    const pos = allUsers[name];
                    if (markersTeman[name]) {
                        markersTeman[name].setLatLng([pos.lat, pos.lng]);
                    } else {
                        markersTeman[name] = L.marker([pos.lat, pos.lng], {
                            icon: L.icon({
                                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                                iconSize: [25, 41], iconAnchor: [12, 41]
                            })
                        }).addTo(map).bindPopup("<b>" + name + "</b> sedang aktif");
                        
                        // Fitur Interaktif: Fokus ke teman baru
                        map.flyTo([pos.lat, pos.lng], 17);
                    }
                }
            }
        });

        function mulaiTracking() {
            const nama = document.getElementById('namaTeman').value;
            if(!nama) return alert("Ketik namamu dulu!");

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((position) => {
                    db.ref('users/' + nama).set({
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        timestamp: Date.now()
                    });
                }, (err) => alert("Aktifkan GPS HP-mu!"), { enableHighAccuracy: true });
                alert("Berhasil! Lokasimu sekarang terpantau di radar.");
            }
        }
    </script>
</body>
</html>
