<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Command Center | Alvino Audio Fix</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #c5a059; --dark: #121212; --glass: rgba(18, 18, 18, 0.96); --danger: #ff4d4d; }
        body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #000; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; }

        .glass-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            padding: 20px; color: white; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-width: 320px; width: calc(100% - 80px);
        }

        input { width: 100%; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); padding: 12px; border-radius: 12px; margin: 8px 0; color: white; outline: none; }
        .btn-main { width: 100%; background: var(--primary); color: var(--dark); border: none; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 5px; }
        #loginOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: none; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="glass-panel" id="mainPanel">
        <h2 id="title" style="margin-top:0; color:var(--primary);">Radar Alvino</h2>
        
        <div id="authSection">
            <input type="text" id="regName" placeholder="Nama Perangkat">
            <button class="btn-main" onclick="aktifkanSistem()">AKTIFKAN RADAR & MIC</button>
            <p style="text-align:center; font-size:11px; margin-top:15px; opacity:0.5; cursor:pointer;" onclick="bukaLogin()">Login Admin</p>
        </div>

        <div id="listUser" style="margin-top:20px;"></div>
    </div>

    <div id="loginOverlay">
        <div class="glass-panel" style="position:relative; left:0; top:0; max-width:280px;">
            <h3>Akses Admin</h3>
            <input type="text" id="userAdm" placeholder="Username">
            <input type="password" id="passAdm" placeholder="Password">
            <button class="btn-main" onclick="cekLoginAdmin()">MASUK</button>
            <button class="btn-main" style="background:none; color:white;" onclick="tutupLogin()">BATAL</button>
        </div>
    </div>

    <div id="map"></div>
    <!-- Audio element untuk mendengar suara -->
    <audio id="remoteAudio" autoplay></audio>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Library Tambahan untuk Streaming Suara -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://lacak-esp8266-24515-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let roleAdmin = false;
        let myName = "";
        let markers = {};
        let myStream;
        let peer;

        var map = L.map('map', { zoomControl: false }).setView([-7.926588, 112.597525], 16);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

        function bukaLogin() { document.getElementById('loginOverlay').style.display = 'flex'; }
        function tutupLogin() { document.getElementById('loginOverlay').style.display = 'none'; }

        function cekLoginAdmin() {
            if(document.getElementById('userAdm').value === "Alvino" && document.getElementById('passAdm').value === "zaragemes2418") {
                roleAdmin = true;
                document.getElementById('title').innerHTML = "Radar Alvino (ADMIN)";
                document.getElementById('authSection').style.display = 'none';
                tutupLogin();
                // Admin Inisialisasi Peer dengan ID Khusus
                peer = new Peer('admin-alvino-radar');
                peer.on('call', call => {
                    call.answer(); // Admin tidak kirim suara balik
                    call.on('stream', stream => {
                        document.getElementById('remoteAudio').srcObject = stream;
                    });
                });
            } else { alert("Akses Ditolak!"); }
        }

        async function aktifkanSistem() {
            myName = document.getElementById('regName').value;
            if(!myName) return alert("Isi nama dulu!");
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                peer = new Peer(myName.replace(/\s+/g, '-').toLowerCase());
                mulaiTracking();
                alert("Sistem Keamanan & Mic Siap!");
            } catch (err) { alert("Mic diblokir browser!"); }
        }

        function mulaiTracking() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    db.ref('users/' + myName).update({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        speed: (pos.coords.speed || 0) * 3.6,
                        lastActive: Date.now()
                    });
                }, null, { enableHighAccuracy: true });
            }
        }

        function toggleMic(id, status) {
            db.ref('users/' + id + '/micActive').set(!status);
        }

        function hapusUser(id) {
            if(confirm("Hapus " + id + "?")) db.ref('users/' + id).remove();
        }

        db.ref('users').on('value', (snap) => {
            const users = snap.val();
            const list = document.getElementById('listUser');
            list.innerHTML = "";

            for (let id in users) {
                const d = users[id];
                const statusMic = d.micActive || false;
                
                // LOGIKA STREAMING (Sisi Target)
                if (id === myName && statusMic && !window.isStreaming) {
                    window.isStreaming = true;
                    peer.call('admin-alvino-radar', myStream);
                    console.log("Mengirim suara ke Admin...");
                } else if (id === myName && !statusMic) {
                    window.isStreaming = false;
                }

                const item = document.createElement('div');
                item.style.cssText = "background:rgba(255,255,255,0.08); padding:15px; border-radius:15px; margin-bottom:12px;";
                
                let html = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <b style="color:#c5a059;">${id}</b>
                        <span style="font-size:10px; background:#c5a059; color:#000; padding:2px 6px; border-radius:4px; font-weight:800;">${Math.round(d.speed || 0)} KM/H</span>
                    </div>
                `;

                if (roleAdmin) {
                    html += `
                        <div style="display:flex; gap:8px;">
                            <button onclick="toggleMic('${id}', ${statusMic})" style="flex:2; background:${statusMic ? '#ff4d4d' : '#2ecc71'}; color:white; border:none; padding:10px; border-radius:10px; font-weight:700; cursor:pointer;">
                                ${statusMic ? '🔴 STOP MIC' : '🎤 UNMUTE'}
                            </button>
                            <button onclick="hapusUser('${id}')" style="flex:1; background:rgba(255,77,77,0.2); color:#ff4d4d; border:1px solid #ff4d4d; padding:10px; border-radius:10px; font-weight:700; cursor:pointer;">HAPUS</button>
                        </div>
                    `;
                }

                item.innerHTML = html;
                list.appendChild(item);
                if (!markers[id]) markers[id] = L.marker([d.lat, d.lng]).addTo(map).bindPopup(id);
                else markers[id].setLatLng([d.lat, d.lng]);
            }
        });
    </script>
</body>
</html>
