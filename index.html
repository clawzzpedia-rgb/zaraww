<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Pro | Alvino Voice & Street</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #c5a059; --dark: #121212; --glass: rgba(18, 18, 18, 0.95); }
        body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #000; overflow: hidden; }
        #map { height: 100vh; width: 100%; }

        /* Floating UI */
        .glass-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            padding: 20px; color: white; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-width: 320px; width: calc(100% - 80px);
            transition: transform 0.5s ease;
        }
        .glass-panel.closed { transform: translateX(-360px); }

        .toggle-ui {
            position: absolute; top: 20px; left: 20px; z-index: 1001;
            background: var(--primary); color: var(--dark); border: none;
            width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h2 { margin: 0 0 15px 0; font-size: 18px; color: var(--primary); padding-left: 50px; }
        
        .user-list { margin-top: 15px; max-height: 300px; overflow-y: auto; }
        .user-item {
            padding: 15px; margin-bottom: 10px; background: rgba(255,255,255,0.05);
            border-radius: 15px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.05);
        }
        .user-item:hover { border-color: var(--primary); }
        
        .address-text { font-size: 11px; color: #aaa; margin-top: 4px; display: block; line-height: 1.4; }
        .speed-badge { background: var(--primary); color: var(--dark); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; }
        
        .mic-btn {
            background: #e74c3c; color: white; border: none; padding: 6px 12px;
            border-radius: 8px; font-size: 11px; cursor: pointer; margin-top: 8px; font-weight: 600;
        }
        .mic-btn.active { background: #2ecc71; }

        input { width: 100%; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; margin: 10px 0; color: white; outline: none; }
        .btn-premium { width: 100%; background: var(--primary); color: var(--dark); border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <button class="toggle-ui" onclick="togglePanel()">☰</button>

    <div class="glass-panel" id="mainPanel">
        <h2>Radar Alvino</h2>
        <input type="text" id="namaTeman" placeholder="Masukkan Nama Kamu">
        <button class="btn-premium" onclick="mulaiTracking()">Aktifkan Sharelok</button>

        <div class="user-list" id="listTeman">
            <div style="font-size: 11px; opacity: 0.5; margin-bottom:10px; letter-spacing: 1px; text-transform: uppercase;">Tracking Engine Aktif</div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://lacak-esp8266-24515-default-rtdb.asia-southeast1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- KONFIGURASI ADMIN (WHITELIST MIC) ---
        // Masukkan nama user yang boleh akses fitur Mic di sini
        const adminUsers = ["Alvino", "Merry", "Admin"]; 
        let currentUser = "";

        var map = L.map('map', { zoomControl: false }).setView([-7.926588, 112.597525], 16);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png').addTo(map);

        var markers = {};
        var peerConnections = {}; // Untuk pengembangan VoIP/Mic nanti

        function togglePanel() { document.getElementById('mainPanel').classList.toggle('closed'); }

        // Fungsi Ambil Nama Jalan Gratis (Nominatim)
        async function getStreetName(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                const data = await response.json();
                return data.address.road || data.address.suburb || "Jalan tidak terdeteksi";
            } catch (e) { return "Mencari lokasi..."; }
        }

        db.ref('users').on('value', async (snap) => {
            const users = snap.val();
            const listEl = document.getElementById('listTeman');
            listEl.innerHTML = '';
            
            for (let name in users) {
                const data = users[name];
                const speed = data.speed ? Math.round(data.speed * 3.6) : 0;
                const road = await getStreetName(data.lat, data.lng);

                // Update Marker
                if (!markers[name]) {
                    markers[name] = L.marker([data.lat, data.lng]).addTo(map).bindPopup(name);
                } else {
                    markers[name].setLatLng([data.lat, data.lng]);
                }

                // Render UI Item
                const item = document.createElement('div');
                item.className = 'user-item';
                
                // Cek apakah user saat ini punya akses Mic
                const micSection = adminUsers.includes(currentUser) ? 
                    `<button class="mic-btn" onclick="toggleMic('${name}')">🎙️ Buka Mic</button>` : "";

                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b style="font-size:15px;">${name}</b>
                        <span class="speed-badge">${speed} km/j</span>
                    </div>
                    <span class="address-text">📍 ${road}</span>
                    ${micSection}
                `;
                
                item.onclick = (e) => { 
                    if(e.target.tagName !== 'BUTTON') {
                        map.flyTo([data.lat, data.lng], 18); 
                    }
                };
                listEl.appendChild(item);
            }
        });

        function toggleMic(targetName) {
            alert(`Meminta akses microphone ke ${targetName}... (Fitur ini memerlukan WebRTC aktif di kedua sisi)`);
            // Logika WebRTC bisa ditambahkan di sini untuk streaming audio real-time
        }

        function mulaiTracking() {
            const nama = document.getElementById('namaTeman').value;
            if(!nama) return alert("Masukkan namamu!");
            currentUser = nama;

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    db.ref('users/' + nama).set({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        speed: pos.coords.speed || 0,
                        timestamp: Date.now()
                    });
                }, null, { enableHighAccuracy: true });
            }
        }
    </script>
</body>
</html>
